[package]
name = "coverio"
version = "0.1.1"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Better coverage badges for crates"
documentation = "https://docs.rs/coverio"
repository = "https://github.com/EngosSoftware/coverio.git"
keywords = ["coverage", "badge"]
homepage = "https://EngosSoftware.github.io/coverio/"
categories = ["development-tools"]
license = "MIT OR Apache-2.0"
rust-version = "1.88.0"
edition = "2024"
include = [
    "src/**",
    "tests/**",
    "docs/**/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dependencies]
antex = "0.2.6"
clars = "0.5.0"
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }

[dev-dependencies]
cli-assert = "0.1.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
